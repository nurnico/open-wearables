name: build-ghcr

# Fork-eigener Build nach GHCR (Runbook Phase 4.3). Der Upstream-Workflow
# publish-images.yml pusht nach Docker Hub (themomentum/*) und läuft im
# Fork nicht — deshalb dieser eigene, auf Push getriggerte Workflow.
# Images: ghcr.io/nurnico/open-wearables-backend / -frontend
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-ghcr.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/nurnico/open-wearables-backend
          - name: frontend
            context: ./frontend
            image: ghcr.io/nurnico/open-wearables-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
